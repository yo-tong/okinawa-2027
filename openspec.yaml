openapi: 3.1.0
info:
  title: Okinawa 2027 Travel Handbook
  version: 1.0.0
  description: Static GitHub Pages application with no HTTP API.
paths: {}
x-travel-handbook:
  date-links:
    fragment: '#days/YYYY-MM-DD'
    legacy-fragment: '#days'
    invalid-date-fallback: first itinerary day
    local-file-links: usable on the same device with the same file path
  transport-cards:
    groups: [american-village-return, outlet-return]
    contents: [primary-service, alternatives, stop, direction, map, official-timetables]
    schedule-status: current weekday timetable, recheck for the actual travel date
  pre-departure-checks:
    storage-key: okinawa27_check_v3
    keep-existing-item-indexes: true
    items: [restaurant-holiday-hours, bus-timetable, aquarium-opening-time, southern-tour-luggage-and-drop-off]
